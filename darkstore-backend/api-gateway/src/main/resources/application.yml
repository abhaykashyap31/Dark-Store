
server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

      routes:
        # Public auth routes
        - id: auth-public
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - RemoveRequestHeader=X-User-Id
            - RemoveRequestHeader=X-User-Role
            - RemoveRequestHeader=X-Store-Id

        - id: auth-protected
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/users/**,/api/v1/stores/**,/api/v1/admin/**
          filters:
            - JwtAuth

        - id: inventory
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/products/**,/api/v1/categories/**,/api/v1/inventory/**
          filters:
            - JwtAuth
            - StripPrefix=2

        - id: inventory-internal
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/internal/products/validate,/api/v1/internal/inventory/**
          filters:
            - JwtAuth
            - StripPrefix=2

        - id: orders
          uri: ${ORDER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/cart/**,/api/v1/orders/**,/api/v1/manager/**,/api/v1/rider/**
          filters:
            - JwtAuth

jwt:
  # Keep identical to auth-service
  secret: ${JWT_SECRET:darkstore-dev-secret-key-change-in-production-0123456789}
