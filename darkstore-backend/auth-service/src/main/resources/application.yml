
server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgresql}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

jwt:
  # Must match API Gateway
  secret: ${JWT_SECRET:darkstore-dev-secret-key-change-in-production-0123456789}
  access-token-minutes: 15
  refresh-token-days: 7

app:
  admin:
    email: admin@darkstore.com
    password: ${ADMIN_PASSWORD:Admin@123}
    name: Dark Store Admin
